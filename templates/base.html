<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Parking Management System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">P</span> ParkSmart</a>
<nav><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('entry') }}">Vehicle Entry</a><a href="{{ url_for('records') }}">Records</a></nav></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}
<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
{% block content %}{% endblock %}</main><footer>Parking Management System · Five-floor prototype</footer></body></html>
